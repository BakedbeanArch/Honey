<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/gift.png" type="image/x-icon">
  <link rel="stylesheet" href="style.css">
  <title>A Gift For You</title>
  <style>
  body {
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #fdf2f8 0%, #f3e8ff 100%);
    min-height: 100vh; 
  }
  #hearts-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: -1;
    pointer-events: none; 
  }
</style>
</head>

<body>
  <canvas id="hearts-canvas"></canvas>
  <div class="heart-container"></div>
  <h1 class="title">For Someone Special</h1>
  <div class="start-btn-container">
    <a href="flower.html" class="btn">
      <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" class="sparkle">
        <path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z"></path>
      </svg>
      <span class="text">Open Gift</span>
    </a>
  </div>

  <script>
    window.onload = function() {
        const container = document.querySelector('.heart-container');
        const heartCount = 20; 

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            
            heart.style.left = Math.random() * 100 + 'vw';
            
            heart.style.animationDuration = Math.random() * 7 + 5 + 's, ' + (Math.random() * 2 + 1) + 's';
            
            heart.style.animationDelay = Math.random() * 5 + 's';
            
            const size = Math.random() * 15 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            container.appendChild(heart);
        }
    };
  </script>
  <script>
  (function() {
    const canvas = document.getElementById('hearts-canvas');
    const ctx = canvas.getContext('2d');
    
    let width, height;
    let particles = [];
    
    // Heart shape definition
    const heartPath = new Path2D('M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');

    const colors = [
      '#ff4b4b', '#ff80ab', '#ffb2dd', '#ea80fc', '#ffcdd2'
    ];

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }

    function createParticle(isInitial = false) {
      const size = Math.random() * 1.5 + 0.5; 
      return {
        x: Math.random() * width,
        y: isInitial ? Math.random() * height : height + (Math.random() * 50 + 20),
        size: size,
        speedY: (Math.random() * 1 + 0.5) * (size * 0.5),
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: Math.random() * 0.05 + 0.01,
        opacity: Math.random() * 0.5 + 0.3,
        color: colors[Math.floor(Math.random() * colors.length)],
      };
    }

    function initParticles() {
      const particleCount = Math.floor((width * height) / 3000);
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push(createParticle(true));
      }
    }

    function loop() {
      ctx.clearRect(0, 0, width, height);

      particles.forEach((p, index) => {
        p.y -= p.speedY;
        p.wobble += p.wobbleSpeed;
        p.x += Math.sin(p.wobble) * 0.5;

        if (p.y < -30 * p.size) {
          particles[index] = createParticle();
        }

        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.scale(p.size, p.size);
        ctx.translate(-12, -12); // Center the path

        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 10;
        
        ctx.fill(heartPath);
        ctx.restore();
      });

      requestAnimationFrame(loop);
    }

    window.addEventListener('resize', () => {
      resize();
      const targetCount = Math.floor((width * height) / 3000);
      if (particles.length < targetCount) {
          for(let i = particles.length; i < targetCount; i++) {
              particles.push(createParticle(true));
          }
      }
    });

    resize();
    initParticles();
    loop();
  })();
</script>
</body>
</html>
