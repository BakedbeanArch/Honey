<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="images/gift.png" type="image/x-icon">
  <!-- Use style.css to share the background logic -->
  <link rel="stylesheet" href="css/style.css">
  <title>A Gift For You</title>
</head>

<body>
  <!-- Heart Background Container -->
  <div class="heart-container"></div>

  <!-- Title -->
  <h1 class="title">For Someone Special</h1>

  <!-- Button -->
  <div class="start-btn-container">
    <a href="flower.html" class="btn">
      <svg height="24" width="24" fill="#FFFFFF" viewBox="0 0 24 24" class="sparkle">
        <path d="M10,21.236,6.755,14.745.264,11.5,6.755,8.255,10,1.764l3.245,6.491L19.736,11.5l-6.491,3.245ZM18,21l1.5,3L21,21l3-1.5L21,18l-1.5-3L18,18l-3,1.5ZM19.333,4.667,20.5,7l1.167-2.333L24,3.5,21.667,2.333,20.5,0,19.333,2.333,17,3.5Z"></path>
      </svg>
      <span class="text">Open Gift</span>
    </a>
  </div>

  <script>
    // Script to generate floating hearts
    window.onload = function() {
        const container = document.querySelector('.heart-container');
        const heartCount = 20; // Number of hearts

        for (let i = 0; i < heartCount; i++) {
            const heart = document.createElement('div');
            heart.classList.add('bg-heart');
            
            // Random Horizontal Position
            heart.style.left = Math.random() * 100 + 'vw';
            
            // Random Animation Duration (Between 5s and 12s)
            heart.style.animationDuration = Math.random() * 7 + 5 + 's, ' + (Math.random() * 2 + 1) + 's';
            
            // Random Delay
            heart.style.animationDelay = Math.random() * 5 + 's';
            
            // Random Size (Between 10px and 25px)
            const size = Math.random() * 15 + 10;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            
            container.appendChild(heart);
        }
    };
  </script>
</body>
</html>
